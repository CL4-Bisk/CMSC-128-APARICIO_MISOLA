<html>
    <head>
        <title>Firebase Test</title>
        <!-- <link rel="stylesheet" type="text/css" href="./css/styles.css"> -->
    </head>

    <script type="module" src="./script/firebase.js"></script>
    <script type="module" src="./script/userAuth.js"></script>

    <body>
        <h1>Welcome, User!</h1>
        <div id="account-auth-container" style="display: block;">
            <div id="login-container" style="display: block;">
                <h2>Login</h2>
                <form id="login-form">
                    <input type="text" id="email-login" placeholder="Email">
                    <input type="password" id="password-login" placeholder="Password">
                    <button id="login-acc-btn">Login</button>
                    <div id="forget-password">
                        <a id="forget-password-btn" href="">Forget password</a>
                    </div>
                    <div id="forget-password-container" style="display: none;">
                        <!-- <input type="email" id="email" placeholder="Email"> -->
                         <p id="show-password"></p>
                        <input type="text" id="security-answer-login", placeholder = >
                        <a id="show-forget-password-btn" href="">Show Password</a> <!-- Very bad design, should change pass instead -->
                        <a id="hide-forget-password-btn" href="">Hide</a>
                    </div>
                </form>
                <div id="register-message">
                    <p>Don't have an account?<a id="switch-register-btn" href="">Register here!</a></p>
                </div>
            </div>
            <div id="register-container" style="display: none;">
                <h2>Register</h2>
                <form id="register-form">
                    <input type="name" id="nickname-register" placeholder="Nickname">
                    <input type="username" id="username-register" placeholder="Username">
                    <input type="text" id="email-register" placeholder="Email">
                    <input type="password" id="password-register" placeholder="Password">
                    <input type="password" id="confirm-password" placeholder="Confirm Password">
                    <label for="security-question-register">Choose a security question:</label>
                    <select id="security-question-register" name="selectedOption">
                    <option value="option1">What is the name of your first pet?</option>
                    <option value="option2">What's the name of your first teacher?</option>
                    <option value="option3">What is your mother's maiden name?</option>
                    </select>
                    <input type="text" id="security-answer-register" placeholder="Answer">
                    <button id="create-acc-btn">Register</button>
                    <div id="login-message">
                        <p>Already have an account?<a id="switch-login-btn" href="#">Log in here!</a></p>
                    </div>
                </form>
            </div>
        </div>
        <div id="account-profile-container">
            
            <div id="profile-container" style="display: none;">
                <h2>Profile Page</h2>

                <ul id="profile-list">
                    <!-- Display name, username, email (hidden), password (hidden)  -->
                </ul>
                
                <div id="change-info-container">
                    <a id="change-info-btn" href="">Edit Profile</a>
                </div>

                <div id="log-out-container">
                    <a id="log-out-profile-btn" href="">Log out</a>
                </div>

            </div>
            <!-- Displayed Temporarily -->
            <div id="edit-profile-container" style="display: none;">
                <h2>Edit Profile Information</h2>
                <form id= "edit-profile-form">
                    <input type="name" id="nickname-edit" placeholder="Nickname">
                    <input type="username" id="username-edit" placeholder="Username">
                    <!-- <input type="email" id="email-edit" placeholder="Email"> -->
                    <input type="password" id="password-edit" placeholder="Password">
                    <input type="password" id="confirm-password-edit" placeholder="Confirm Password">
                    <!-- <label for="security-question">Choose a security question:</label>
                    <select id="security-question" name="selectedOption">
                    <option value="option1">What is the name of your first pet?</option>
                    <option value="option2">What's the name of your first teacher?</option>
                    <option value="option3">What is your mother's maiden name?</option>
                    </select>
                    <input type="text" id="security-answer-register" placeholder="Answer">
                    </form> -->
                    <button type="submit" id="update-info-btn">Update Information</button>
                </form>

                <div id="back-profile-container">
                    <a id="back-profile-btn" href="">Back to profile page</a>
                </div>

            </div>
        </div>
    </body>
</html>
